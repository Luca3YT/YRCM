<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Milestone Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  /* ══ テーマ（管理画面の設定から切り替わる） ══
     配信画面の上に乗るので、面は落ち着いた無彩色。色はメーターの琥珀色だけ */
  body, body[data-theme="graphite"] {
    --t-bg: #19191b; --t-raised: #232325;
    --t-line: rgba(237,237,237,.08); --t-line-strong: rgba(237,237,237,.14);
    --t-text: #ededed; --t-sub: #a1a1a6; --t-muted: #85858b;
    --t-accent: #f2a93b; --t-meter-off: rgba(237,237,237,.08);
    --t-shadow: 0 16px 40px rgba(0,0,0,.45);
  }
  body[data-theme="warm"] {
    --t-bg: #1c1a18; --t-raised: #262421;
    --t-line: rgba(239,233,222,.08); --t-line-strong: rgba(239,233,222,.14);
    --t-text: #efe9de; --t-sub: #aaa398; --t-muted: #8a847a;
    --t-accent: #f2a93b; --t-meter-off: rgba(239,233,222,.08);
    --t-shadow: 0 16px 40px rgba(0,0,0,.45);
  }
  body[data-theme="light"] {
    --t-bg: #ffffff; --t-raised: #f4f4f5;
    --t-line: rgba(23,23,23,.08); --t-line-strong: rgba(23,23,23,.14);
    --t-text: #171717; --t-sub: #525252; --t-muted: #737373;
    --t-accent: #f2a93b; --t-meter-off: rgba(23,23,23,.08);
    --t-shadow: 0 12px 32px rgba(0,0,0,.18);
  }
  :root { --ease: cubic-bezier(.22,1,.36,1); --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'IBM Plex Sans JP', 'Yu Gothic UI', 'Meiryo', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  .ic { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== トースト共通 ===== */
  #toast, #progress-toast {
    position: fixed;
    bottom: 40px;
    right: 40px;
    width: 380px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .4s var(--ease), transform .4s var(--ease);
    pointer-events: none;
  }
  #toast { z-index: 9999; }
  #progress-toast { z-index: 9998; /* 実績トーストより下 */ }
  #toast.show, #progress-toast.show { opacity: 1; transform: translateY(0); }
  #toast.hide, #progress-toast.hide { opacity: 0; transform: translateY(8px); transition-duration: .3s; }

  .toast-inner, .progress-toast-inner {
    background: var(--t-bg);
    border: 1px solid var(--t-line-strong);
    border-radius: 16px;
    padding: 20px 24px;
    box-shadow: var(--t-shadow);
    position: relative;
    overflow: hidden;
  }
  /* 実績トーストだけ、上辺にアクセントの線（光らせない） */
  .toast-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 2px;
    background: var(--t-accent);
    border-radius: 0 0 2px 2px;
  }

  .toast-header, .progress-toast-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toast-header .ic { color: var(--t-accent); }
  .progress-toast-header .ic { color: var(--t-muted); }
  .achievement-label, .progress-label-text { font-size: 13px; font-weight: 500; color: var(--t-sub); }

  .milestone-number, .progress-count {
    font-weight: 600;
    font-size: 56px;
    line-height: 1;
    color: var(--t-text);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .progress-count { font-size: 44px; font-weight: 500; }
  #toast.show .milestone-number { animation: rise .5s var(--ease) .1s both; }
  #progress-toast.show .progress-count { animation: rise .5s var(--ease) .1s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .milestone-title, .progress-sub { font-size: 14px; color: var(--t-sub); margin-top: 8px; }
  .progress-sub strong { color: var(--t-text); font-weight: 500; font-family: var(--mono); }

  /* 時速・経過・次の目標 */
  .stats-row, .progress-stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 16px;
    border-top: 1px solid var(--t-line);
    padding-top: 12px;
  }
  .stat-card, .progress-stat { padding: 0 12px; border-left: 1px solid var(--t-line); }
  .stat-card:first-child, .progress-stat:first-child { padding-left: 0; border-left: none; }
  .stat-value, .progress-stat-value { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--t-text); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat-value.hot, .progress-stat-value.accent { color: var(--t-text); }
  .stat-label, .progress-stat-label { font-size: 12px; color: var(--t-muted); margin-top: 4px; }

  /* シグネチャー: VUメーター風の目盛り付きバー */
  .progress-section, .progress-bar-section { margin-top: 16px; }
  .progress-label, .progress-bar-labels { display: flex; justify-content: space-between; font-size: 12px; font-family: var(--mono); color: var(--t-muted); margin-bottom: 8px; }
  .progress-bar-bg, .progress-bar-bg2 {
    height: 8px;
    border-radius: 2px;
    overflow: hidden;
    background: repeating-linear-gradient(90deg, var(--t-meter-off) 0 6px, transparent 6px 8px);
  }
  .progress-bar-fill, .progress-bar-fill2 {
    height: 100%;
    width: 0%;
    background: var(--t-accent);
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px);
    mask: repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 8px);
    transition: width 1s var(--ease);
  }
  .progress-pct { text-align: right; font-size: 12px; font-family: var(--mono); color: var(--t-sub); margin-top: 8px; }

  /* ===== 接続インジケーター (OBSプレビュー用) ===== */
  #ws-indicator {
    position: fixed;
    top: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(255,255,255,.7);
    background: rgba(0,0,0,.5);
    padding: 4px 12px;
    border-radius: 6px;
    transition: opacity 1s var(--ease);
  }
  #ws-indicator.fade-out { opacity: 0; }
  #ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #85858b; }
  #ws-dot.on { background: #4cc38a; }
  #ws-dot.off { background: #e5484d; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* キャッシュ未更新警告（テーマに関係なく赤で目立たせる） */
  #cache-warning {
    position: fixed; inset: 0;
    background: rgba(150, 20, 20, .55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; transition: opacity .8s var(--ease); pointer-events: none;
  }
  #cache-warning.hidden { opacity: 0; }
  #cache-warning-banner {
    display: flex; align-items: center; gap: 12px;
    background: #b42323; color: #fff;
    font-size: 20px; font-weight: 500;
    padding: 16px 32px; border-radius: 12px;
  }
  #cache-warning-banner .ic { width: 24px; height: 24px; }
  #cache-warning-sub { color: rgba(255,255,255,.85); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body data-theme="graphite">
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<!-- アイコン: lucide (ISC License) https://lucide.dev -->
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /> <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /> <path d="M4 22h16" /> <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /> <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /> <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="m12 14 4-4" /> <path d="M3.34 19a10 10 0 1 1 17.32 0" /></symbol>
<symbol id="i-circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></symbol>
</svg>

<!-- キャッシュ未更新警告オーバーレイ -->
<div id="cache-warning">
  <div id="cache-warning-banner"><svg class="ic"><use href="#i-circle-alert"/></svg>OBS のキャッシュを更新してください</div>
  <div id="cache-warning-sub">ブラウザソースを右クリック →「キャッシュを更新」</div>
</div>

<div id="ws-indicator">
  <div id="ws-dot"></div>
  <span id="ws-text">接続中…</span>
</div>

<div id="toast">
  <div class="toast-inner">
    <div class="toast-header">
      <svg class="ic"><use href="#i-trophy"/></svg>
      <span class="achievement-label">リアクション達成</span>
    </div>

    <div class="milestone-number" id="milestone-num">1,000</div>
    <div class="milestone-title" id="milestone-title">リアクションが 1,000 を超えました</div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value hot" id="stat-speed">--</div>
        <div class="stat-label">時速</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-elapsed">--</div>
        <div class="stat-label">達成まで</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-next">--</div>
        <div class="stat-label">次の目標</div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span id="prog-from">0</span>
        <span id="prog-to">次の目標</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>
  </div>
</div>

<!-- 進捗トースト -->
<div id="progress-toast">
  <div class="progress-toast-inner">
    <div class="progress-toast-header">
      <svg class="ic"><use href="#i-gauge"/></svg>
      <span class="progress-label-text">いまのリアクション</span>
    </div>

    <div class="progress-count" id="prog-count">0</div>
    <div class="progress-sub" id="prog-sub">次の目標まで <strong id="prog-remaining">--</strong></div>

    <div class="progress-stats-row">
      <div class="progress-stat">
        <div class="progress-stat-value accent" id="prog-speed">--</div>
        <div class="progress-stat-label">時速</div>
      </div>
      <div class="progress-stat">
        <div class="progress-stat-value" id="prog-elapsed">--</div>
        <div class="progress-stat-label">経過</div>
      </div>
      <div class="progress-stat">
        <div class="progress-stat-value" id="prog-next-val">--</div>
        <div class="progress-stat-label">次の目標</div>
      </div>
    </div>

    <div class="progress-bar-section">
      <div class="progress-bar-labels">
        <span id="prog-bar-from">0</span>
        <span id="prog-bar-to">--</span>
      </div>
      <div class="progress-bar-bg2">
        <div class="progress-bar-fill2" id="progress-bar-fill2"></div>
      </div>
      <div class="progress-pct" id="prog-pct">0%</div>
    </div>
  </div>
</div>

<script>
const WS_URL = `ws://${location.hostname}:3001`;
let soundVolume = 1.0;      // 音量（0.0〜1.0）
let soundType = 'chime';    // 音の種類
let customSoundB64 = null;
let customDecodedBuffer = null;

// ===== 効果音（Web Audio API - ファイル不要）=====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playAchievementSound() {
  try {
    const ctx = getAudioCtx();
    const vol = soundVolume;
    const now = ctx.currentTime;

    // カスタム音源
    if (soundType === 'custom' && customDecodedBuffer) {
      const s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = customDecodedBuffer; s.connect(g); g.connect(ctx.destination);
      g.gain.value = vol; s.start(0);
      return;
    }

    if (soundType === 'fanfare') {
      [[392,0],[523.25,.18],[659.25,.36],[783.99,.54],[1046.5,.72]].forEach(([f,t])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.value=f;
        g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(.2*vol,now+t+.04);
        g.gain.exponentialRampToValueAtTime(.001,now+t+.35);o.start(now+t);o.stop(now+t+.4);
      });
    } else if (soundType === 'drumroll') {
      const bo=ctx.createOscillator(),bg=ctx.createGain();
      bo.connect(bg);bg.connect(ctx.destination);bo.type='sine';
      bo.frequency.setValueAtTime(150,now);bo.frequency.exponentialRampToValueAtTime(40,now+.4);
      bg.gain.setValueAtTime(.5*vol,now);bg.gain.exponentialRampToValueAtTime(.001,now+.5);
      bo.start(now);bo.stop(now+.5);
      for(let i=0;i<10;i++){
        const t=now+.04*i,buf=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate);
        const d=buf.getChannelData(0); for(let j=0;j<d.length;j++) d[j]=Math.random()*2-1;
        const s=ctx.createBufferSource(),sg=ctx.createGain(),sf=ctx.createBiquadFilter();
        sf.type='bandpass';sf.frequency.value=3000;s.buffer=buf;
        s.connect(sf);sf.connect(sg);sg.connect(ctx.destination);
        sg.gain.setValueAtTime((.04+i*.02)*vol,t);sg.gain.exponentialRampToValueAtTime(.001,t+.05);s.start(t);
      }
    } else if (soundType === 'magical') {
      [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>{
        const t=now+i*.08,o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18*vol,t+.02);
        g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.45);
      });
    } else if (soundType === 'pinpon') {
      [[1046.5,0,.15],[523.25,.22,.2]].forEach(([f,t,v])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(v*vol,now+t);g.gain.exponentialRampToValueAtTime(.001,now+t+.6);
        o.start(now+t);o.stop(now+t+.65);
      });
    } else {
      // デフォルト: チャイム
      function bell(f,t,v){
        const o1=ctx.createOscillator(),g1=ctx.createGain();
        o1.connect(g1);g1.connect(ctx.destination);o1.type='sine';o1.frequency.value=f;
        g1.gain.setValueAtTime(v*vol,now+t);g1.gain.exponentialRampToValueAtTime(.001,now+t+1.8);
        o1.start(now+t);o1.stop(now+t+2.0);
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);o2.type='sine';o2.frequency.value=f*2.756;
        g2.gain.setValueAtTime(v*.4*vol,now+t);g2.gain.exponentialRampToValueAtTime(.001,now+t+.8);
        o2.start(now+t);o2.stop(now+t+1.0);
      }
      bell(523.25,0,.30);bell(659.25,.22,.25);bell(783.99,.44,.35);
    }
  } catch (e) { console.error('sound error:', e); }
}
const MILESTONES = [100, 500, 1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 50000];
const DISPLAY_DURATION = 7000;

// テーマ（管理画面の設定に合わせる）。旧テーマ名（v1.7.0）は読み替える
const THEMES = ['graphite', 'warm', 'light'];
const OLD_THEMES = { studio: 'graphite', neon: 'graphite', minimal: 'light' };
function applyTheme(theme) {
  theme = OLD_THEMES[theme] || theme;
  if (THEMES.includes(theme)) document.body.dataset.theme = theme;
}

let toastQueue = [];
let isShowing = false;
let toastTimer = null;
let ws = null;

// ===== WebSocket 接続 =====
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setWsStatus(true);
    ws.send(JSON.stringify({ type: 'register', role: 'overlay' }));
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }

    if (msg.type === 'milestone') {
      queueMilestone(msg);
    }
    if (msg.type === 'volume_update') {
      soundVolume = Math.max(0, Math.min(1, msg.volume));
      if (msg.soundType) soundType = msg.soundType;
      // 同じ音源が再送されてきたときはデコードし直さない
      if (msg.customSoundB64 && msg.customSoundB64 !== customSoundB64) {
        customSoundB64 = msg.customSoundB64;
        // デコードしてメモリ保持
        try {
          const bin = atob(customSoundB64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          ctx.decodeAudioData(bytes.buffer.slice(0), d => { customDecodedBuffer = d; ctx.close(); }, () => ctx.close());
        } catch (e) {}
      }
    }
    if (msg.type === 'progress') {
      showProgressToast(msg);
    }
    if (msg.type === 'theme_update') {
      applyTheme(msg.theme);
    }
    if (msg.type === 'reset') {
      toastQueue = [];
      hideProgressToast();
    }
  };

  // error のあとに close も必ず来るので、再接続は close でだけ行う
  // （両方で再接続すると切断のたびに接続が倍々に増え、演出が何重にも出る）
  ws.onerror = () => {};
  ws.onclose = () => {
    setWsStatus(false);
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 3000);
  };
}
let reconnectTimer = null;

let liveTimer = null;

function setWsStatus(online) {
  document.getElementById('ws-dot').className = online ? 'on' : 'off';
  document.getElementById('ws-text').textContent = online ? 'LIVE' : '再接続中…';

  if (online) {
    // ① キャッシュ更新済み確認 → 警告を消す
    const warn = document.getElementById('cache-warning');
    warn.classList.add('hidden');
    setTimeout(() => { warn.style.display = 'none'; }, 900);

    // ② LIVE バッジを 30 秒後にフェードアウト
    clearTimeout(liveTimer);
    document.getElementById('ws-indicator').classList.remove('fade-out');
    liveTimer = setTimeout(() => {
      document.getElementById('ws-indicator').classList.add('fade-out');
    }, 30000);
  } else {
    // 切断時はLIVEバッジを再表示
    clearTimeout(liveTimer);
    document.getElementById('ws-indicator').classList.remove('fade-out');
  }
}

// ===== キュー管理 =====
function queueMilestone(data) {
  toastQueue.push(data);
  if (!isShowing) showNext();
}

function showNext() {
  if (toastQueue.length === 0) { isShowing = false; return; }
  isShowing = true;
  showToast(toastQueue.shift());
}

// ===== トースト表示 =====
function showToast(data) {
  const { milestone, speed, elapsedMs } = data;

  const prevIdx = MILESTONES.indexOf(milestone) - 1;
  const prevMilestone = prevIdx >= 0 ? MILESTONES[prevIdx] : 0;
  const nextMilestone = MILESTONES[MILESTONES.indexOf(milestone) + 1];

  // 表示更新
  document.getElementById('milestone-num').textContent = milestone.toLocaleString();
  document.getElementById('milestone-title').textContent = `リアクションが ${milestone.toLocaleString()} を超えました`;
  document.getElementById('stat-speed').textContent = speed >= 10000 ? `${(speed/1000).toFixed(1)}k` : speed.toLocaleString();
  document.getElementById('stat-elapsed').textContent = formatElapsed(elapsedMs);
  document.getElementById('stat-next').textContent = nextMilestone ? nextMilestone.toLocaleString() : '—';
  document.getElementById('prog-from').textContent = prevMilestone.toLocaleString();
  // メーターは「前の節目 → 今回の節目」の区間（満タン＝この区間を達成）
  document.getElementById('prog-to').textContent = milestone.toLocaleString();

  // 効果音再生
  playAchievementSound();

  // 表示
  const toast = document.getElementById('toast');
  toast.className = 'show';
  setTimeout(() => { document.getElementById('progress-fill').style.width = '100%'; }, 100);

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
    toast.classList.add('hide');
    document.getElementById('progress-fill').style.width = '0%';
    setTimeout(() => { toast.classList.remove('hide'); isShowing = false; showNext(); }, 600);
  }, DISPLAY_DURATION);
}

function formatElapsed(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h > 0) return `${h}h${m}m`;
  if (m > 0) return `${m}m${s}s`;
  return `${s}s`;
}

// ===== 進捗トースト =====
let progressTimer = null;
const PROGRESS_DURATION = 6000;

function showProgressToast(data) {
  const { count, prevM, nextM, pct, speed, remaining, elapsedMs } = data;

  // 実績トーストが表示中は少し上にずらす
  const pt = document.getElementById('progress-toast');
  if (isShowing) {
    // テーマで高さが変わるので、実績トーストの実際の高さ＋すき間の分だけ上げる
    const h = document.getElementById('toast').offsetHeight || 240;
    pt.style.bottom = (40 + h + 14) + 'px';
  } else {
    pt.style.bottom = '40px';
  }

  // 内容を更新
  document.getElementById('prog-count').textContent = count.toLocaleString();
  document.getElementById('prog-remaining').textContent =
    nextM ? `あと ${remaining.toLocaleString()}` : '';
  document.getElementById('prog-sub').innerHTML =
    nextM ? `次の目標まで <strong id="prog-remaining">あと ${remaining.toLocaleString()}</strong>` : 'すべてのマイルストーンを達成しました';

  document.getElementById('prog-speed').textContent =
    speed >= 10000 ? `${(speed/1000).toFixed(1)}k` : speed.toLocaleString();
  document.getElementById('prog-elapsed').textContent = formatElapsed(elapsedMs);
  document.getElementById('prog-next-val').textContent =
    nextM ? nextM.toLocaleString() : '—';

  document.getElementById('prog-bar-from').textContent = prevM.toLocaleString();
  document.getElementById('prog-bar-to').textContent = nextM ? nextM.toLocaleString() : '—';
  document.getElementById('prog-pct').textContent = `${pct}%`;

  // 表示
  pt.className = 'show';
  setTimeout(() => {
    document.getElementById('progress-bar-fill2').style.width = pct + '%';
  }, 100);

  clearTimeout(progressTimer);
  progressTimer = setTimeout(() => {
    hideProgressToast();
  }, PROGRESS_DURATION);
}

function hideProgressToast() {
  const pt = document.getElementById('progress-toast');
  pt.classList.remove('show');
  pt.classList.add('hide');
  document.getElementById('progress-bar-fill2').style.width = '0%';
  setTimeout(() => pt.classList.remove('hide'), 600);
}

connect();
</script>
